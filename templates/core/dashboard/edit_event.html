{% extends 'core/dashboard/dashboard_base.html' %}

{% block title %}Edit Event - QuizMaster Pro{% endblock %}

{% block dashboard_content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Edit Event</h1>
    <p class="text-gray-600 mt-2">Update event details</p>
</div>

<div class="bg-white rounded-xl shadow max-w-2xl">
    <div class="p-8">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Event Title</label>
                {{ form.title }}
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                {{ form.description }}
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Date & Time</label>
                {{ form.date }}
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                {{ form.location }}
            </div>
            
            <div class="flex space-x-4 pt-4">
                <button type="submit" class="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-secondary transition">
                    Save Changes
                </button>
                <a href="{% url 'my_events' %}" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
