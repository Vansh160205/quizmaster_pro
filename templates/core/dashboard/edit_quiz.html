{% extends 'core/dashboard/dashboard_base.html' %}

{% block title %}Edit Quiz - QuizMaster Pro{% endblock %}

{% block dashboard_content %}
<!-- Page Header -->
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Edit Quiz</h1>
    <p class="text-gray-600 mt-2">Update quiz details</p>
</div>

<!-- Form -->
<div class="bg-white rounded-xl shadow max-w-2xl">
    <div class="p-8">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="id_title" class="block text-sm font-medium text-gray-700 mb-2">
                    Quiz Title <span class="text-red-500">*</span>
                </label>
                {{ form.title }}
            </div>
            
            <div>
                <label for="id_description" class="block text-sm font-medium text-gray-700 mb-2">
                    Description <span class="text-red-500">*</span>
                </label>
                {{ form.description }}
            </div>
            
            <div class="flex items-center">
                {{ form.is_published }}
                <label for="id_is_published" class="ml-2 text-sm text-gray-700">
                    Published (visible to all users)
                </label>
            </div>
            
            <div class="flex space-x-4 pt-4">
                <button type="submit" class="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-secondary transition">
                    Save Changes
                </button>
                <a href="{% url 'add_questions' quiz.id %}" class="bg-secondary text-white px-6 py-3 rounded-lg font-semibold hover:bg-primary transition">
                    Manage Questions
                </a>
                <a href="{% url 'my_quizzes' %}" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
