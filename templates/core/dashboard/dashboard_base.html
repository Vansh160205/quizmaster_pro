{% extends 'base.html' %}

{% block content %}
<div class="flex min-h-screen bg-gray-100">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg hidden md:block">
        <div class="p-6">
            <h2 class="text-xl font-bold text-gray-800">Dashboard</h2>
            <p class="text-sm text-gray-500 mt-1">Welcome, {{ user.username }}</p>
        </div>
        
        <nav class="mt-2">
            <a href="{% url 'dashboard' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 {% if request.resolver_match.url_name == 'dashboard' %}bg-primary/10 border-r-4 border-primary text-primary{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                </svg>
                Overview
            </a>
            
            <a href="{% url 'profile' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 {% if request.resolver_match.url_name == 'profile' %}bg-primary/10 border-r-4 border-primary text-primary{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                Profile
            </a>

            <div class="px-6 py-3 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                Quizzes
            </div>
            
            <a href="{% url 'my_quizzes' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 {% if request.resolver_match.url_name == 'my_quizzes' %}bg-primary/10 border-r-4 border-primary text-primary{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                My Quizzes
            </a>
            
            <a href="{% url 'create_quiz' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 {% if request.resolver_match.url_name == 'create_quiz' %}bg-primary/10 border-r-4 border-primary text-primary{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Create Quiz
            </a>
            
            <a href="{% url 'my_submissions' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 {% if request.resolver_match.url_name == 'my_submissions' %}bg-primary/10 border-r-4 border-primary text-primary{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                My Submissions
            </a>

            <div class="px-6 py-3 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                Events
            </div>
            
            <a href="{% url 'my_events' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 {% if request.resolver_match.url_name == 'my_events' %}bg-primary/10 border-r-4 border-primary text-primary{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                My Events
            </a>
            
            <a href="{% url 'create_event' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 {% if request.resolver_match.url_name == 'create_event' %}bg-primary/10 border-r-4 border-primary text-primary{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Create Event
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        {% block dashboard_content %}{% endblock %}
    </main>
</div>
{% endblock %}
